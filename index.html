<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyPark Prototype</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color:#172033; background:#eaf1ff; --brand:#2563eb; --muted:#667085; --soft:#e0ecff; --ok:#059669; --warn:#d97706; }
      * { box-sizing:border-box; } body { margin:0; background:var(--soft); } button,input,select,textarea { font:inherit; }
      .phone { max-width:430px; min-height:100vh; margin:auto; background:#f8fbff; box-shadow:0 0 60px #b6c5df; }
      header { padding:22px 18px 14px; color:white; background:linear-gradient(135deg,#1d4ed8,#38bdf8); border-radius:0 0 28px 28px; }
      main { padding:16px; display:grid; gap:14px; } h1,h2,h3,p { margin:0; } h1 { font-size:28px; } h2 { font-size:21px; } h3 { font-size:16px; }
      .card { background:white; border:1px solid #dbe7f7; border-radius:22px; padding:15px; box-shadow:0 10px 24px #d7e1f055; }
      .grid { display:grid; gap:10px; } .row { display:flex; gap:10px; align-items:center; justify-content:space-between; } .wrap { flex-wrap:wrap; }
      .muted { color:var(--muted); font-size:13px; line-height:1.4; } .hidden { display:none; }
      input,select,textarea { width:100%; border:1px solid #cbd5e1; border-radius:14px; padding:11px; background:white; } textarea { min-height:72px; }
      button { width:100%; border:0; border-radius:14px; padding:12px; color:white; background:var(--brand); font-weight:750; cursor:pointer; }
      button.secondary { background:#e0ecff; color:#174ea6; } button.ghost { background:white; color:#334155; border:1px solid #cbd5e1; }
      .choice { text-align:left; display:grid; gap:4px; } .choice strong { font-size:16px; } .choice span { font-size:12px; opacity:.9; }
      .progress { height:8px; border-radius:999px; background:#dbe7f7; overflow:hidden; } .progress > span { display:block; height:100%; background:var(--brand); width:var(--pct); }
      .badge { display:inline-flex; padding:5px 9px; border-radius:999px; background:#e0f2fe; color:#0369a1; font-size:12px; font-weight:800; }
      .badge.ok { background:#dcfce7; color:#047857; } .badge.warn { background:#fef3c7; color:#b45309; }
      .price { font-size:20px; font-weight:850; } .option { display:grid; gap:8px; border:1px solid #e2e8f0; border-radius:18px; padding:13px; }
      .map { height:150px; position:relative; overflow:hidden; border-radius:20px; background:linear-gradient(90deg,#dbeafe 1px,transparent 1px),linear-gradient(#dbeafe 1px,transparent 1px),#f8fafc; background-size:44px 44px; }
      .pin { position:absolute; transform:translate(-50%,-50%); padding:5px 8px; border-radius:999px; background:white; border:2px solid var(--brand); font-size:12px; font-weight:800; box-shadow:0 6px 18px #94a3b8; } .pin.dest{left:50%;top:50%;background:#1d4ed8;color:white}.pin.p1{left:35%;top:32%}.pin.p2{left:68%;top:38%}.pin.p3{left:58%;top:72%}
      .stepbox { padding:10px 12px; border-radius:14px; background:#eff6ff; font-size:14px; }
      .ref { display:inline-flex; width:max-content; margin-bottom:5px; padding:2px 5px; border:1px dashed #fca5a5; border-radius:6px; background:#fff5f5; color:#dc2626; font-size:8px; font-weight:800; letter-spacing:.01em; }
      .refs-off .ref { display:none; }
    </style>
  </head>
  <body>
    <div class="phone" id="shell">
      <header>
        <p class="muted" style="color:#dbeafe">Guided mobile prototype</p>
        <h1>EasyPark</h1>
        <p id="subtitle">Choose a use case and follow the flow step by step.</p>
      </header>
      <main>
        <section class="card" data-ref="REF-GUIDE-01">
          <div class="row"><span class="ref">REF-GUIDE-01</span><button class="ghost" id="toggleRefs" style="width:auto;padding:8px 10px">Hide labels</button></div>
          <p class="muted">Use red labels in Buzz feedback. Example: “Change DRV-RESULTS-01 to show distance first”.</p>
        </section>

        <section id="home" class="card grid" data-ref="APP-HOME-01">
          <span class="ref">APP-HOME-01</span>
          <h2>What do you want to do?</h2>
          <button class="choice" data-flow="driver"><strong>Find parking</strong><span>Driver flow: destination → results → reservation → session</span></button>
          <button class="choice secondary" data-flow="provider"><strong>Offer my parking</strong><span>Provider flow: location → availability → tariff → review</span></button>
          <button class="choice secondary" data-flow="operator"><strong>Administer EasyPark</strong><span>Operator flow: approvals, incidents, settlements</span></button>
          <button class="choice ghost" id="demo"><strong>Run guided demo</strong><span>Autofill a complete driver reservation</span></button>
        </section>

        <section id="wizard" class="card grid hidden">
          <div class="row"><button class="ghost" id="back" style="width:auto">Back</button><span class="badge" id="stepLabel">Step</span></div>
          <div class="progress"><span id="progress"></span></div>
          <div id="screen" class="grid"></div>
          <div class="row"><button class="secondary" id="homeBtn">Home</button><button id="next">Continue</button></div>
        </section>
      </main>
    </div>

    <script>
      const seed = [
        { id:'garage-12', kind:'Private space', title:'Covered garage near Armenia', location:'Armenia 1500', comment:'Remote gate, fits car/SUV, security camera.', schedule:'Every day 08:00-22:00', price:'$2,100', payment:'Mercado Pago', meters:120, covered:true, rating:4.8, status:'Published', reservable:true },
        { id:'parking-8', kind:'Traditional parking', title:'Commercial parking on Honduras', location:'Honduras 4700', comment:'External payment at desk.', schedule:'24h', price:'$2,800', payment:'On site', meters:260, covered:true, rating:4.2, status:'Published', reservable:false },
        { id:'street-a', kind:'Street guidance', title:'Likely street availability near Serrano', location:'Serrano area', comment:'Uncertain public availability.', schedule:'Now', price:'Low', payment:'Street rules', meters:420, covered:false, rating:3.1, status:'Guidance', reservable:false }
      ];
      const state = { flow:null, step:0, selected:null, destination:'Palermo Soho', time:'Today 19:00', duration:'2 hours', vehicle:'Car', filter:'smart', provider:{} };
      const $ = id => document.getElementById(id), spaces = () => JSON.parse(localStorage.getItem('easyparkProviderSpaces') || '[]'), save = s => localStorage.setItem('easyparkProviderSpaces', JSON.stringify(s));
      const price = o => Number(String(o.price || '').replace(/[^0-9]/g,'')) || 9999;
      const options = () => [...seed, ...spaces()].filter(o => state.filter === 'covered' ? o.covered : true).sort((a,b) => state.filter === 'cheap' ? price(a)-price(b) : state.filter === 'near' ? a.meters-b.meters : Number(b.reservable)-Number(a.reservable) || a.meters-b.meters);
      const flows = { driver:['DRV-START-01','DRV-TIME-01','DRV-RESULTS-01','DRV-DETAIL-01','DRV-CHECKOUT-01','DRV-SESSION-01'], provider:['PROV-LOCATION-01','PROV-SPACE-01','PROV-AVAIL-01','PROV-TARIFF-01','PROV-PAYMENT-01','PROV-REVIEW-01'], operator:['OPS-HOME-01','OPS-PENDING-01','OPS-INCIDENTS-01','OPS-SETTLEMENTS-01'] };
      function start(flow){ state.flow=flow; state.step=0; $('home').classList.add('hidden'); $('wizard').classList.remove('hidden'); render(); }
      function ref(code){ return `<span class="ref">${code}</span>`; }
      function render(){ const code = flows[state.flow][state.step], total = flows[state.flow].length; $('stepLabel').textContent = `Step ${state.step+1} of ${total}`; $('progress').style.setProperty('--pct', `${((state.step+1)/total)*100}%`); $('subtitle').textContent = state.flow === 'driver' ? 'Driver guided flow.' : state.flow === 'provider' ? 'Provider guided flow.' : 'Operator guided flow.'; $('back').textContent = state.step ? 'Back' : 'Use cases'; $('next').textContent = state.step === total-1 ? 'Finish' : 'Continue'; $('screen').innerHTML = screens[code](); bindScreen(code); }
      const screens = {
        'DRV-START-01': () => `${ref('DRV-START-01')}<h2>Where are you going?</h2><p class="muted">Start with a destination, not your current location.</p><input id="destination" value="${state.destination}" />`,
        'DRV-TIME-01': () => `${ref('DRV-TIME-01')}<h2>When do you need parking?</h2><input id="time" value="${state.time}" /><select id="duration"><option>2 hours</option><option>4 hours</option><option>Full day</option></select><select id="vehicle"><option>Car</option><option>SUV</option><option>Motorbike</option></select><select id="filter"><option value="smart">Smart ranking</option><option value="cheap">Cheapest first</option><option value="near">Nearest first</option><option value="covered">Covered only</option></select>`,
        'DRV-RESULTS-01': () => `${ref('DRV-RESULTS-01')}<h2>Recommended options</h2><div class="map" data-ref="DRV-MAP-01"><span class="ref">DRV-MAP-01</span><span class="pin dest">You</span><span class="pin p1">P1</span><span class="pin p2">P2</span><span class="pin p3">P3</span></div>${options().map(o => `<article class="option" data-pick="${o.id}" data-ref="DRV-RESULT-CARD-01">${ref('DRV-RESULT-CARD-01')}<div class="row wrap"><span class="badge ${o.status==='Published'?'ok':'warn'}">${o.kind}</span><span class="price">${o.price}</span></div><h3>${o.title}</h3><p class="muted">${o.meters}m from ${state.destination}. ${o.schedule}. ${o.comment}</p><button>${o.reservable && o.status === 'Published' ? 'Choose this option' : 'View guidance'}</button></article>`).join('')}`,
        'DRV-DETAIL-01': () => { const o = state.selected || options()[0]; state.selected = o; return `${ref('DRV-DETAIL-01')}<h2>${o.title}</h2><div class="option"><div class="row"><span class="badge">${o.covered?'Covered':'Open'}</span><strong>${o.rating}★</strong></div><p class="muted"><strong>Where:</strong> ${o.location}<br><strong>Availability:</strong> ${o.schedule}<br><strong>Instructions:</strong> ${o.comment}<br><strong>Payment:</strong> ${o.payment}</p></div>`; },
        'DRV-CHECKOUT-01': () => { const o = state.selected; return `${ref('DRV-CHECKOUT-01')}<h2>Confirm reservation</h2><div class="stepbox">Hold: active for 05:00</div><div class="stepbox">Price + EasyPark fee: <strong>$${Math.round(price(o)*1.12).toLocaleString('en-US')}</strong></div><div class="stepbox">Payment method: ${o.payment}</div><button class="secondary" id="rejectPay" data-ref="DRV-PAY-FAIL-01">${ref('DRV-PAY-FAIL-01')} Simulate payment rejected</button><button class="ghost" id="expireHold" data-ref="DRV-HOLD-EXP-01">${ref('DRV-HOLD-EXP-01')} Expire hold</button><p class="muted" id="checkoutState">Ready to approve simulated payment.</p>`; },
        'DRV-SESSION-01': () => `${ref('DRV-SESSION-01')}<h2>Active session</h2><div class="stepbox">Reservation code: <strong>EP-${String(Date.now()).slice(-5)}</strong></div><div class="stepbox">Navigation: ${state.selected?.meters || 120}m walk to ${state.selected?.location || 'destination'}</div><div class="stepbox">Remaining time: <strong id="remaining">1h 58m</strong></div><button class="secondary" id="extend">Extend 30 min</button><button class="ghost" id="endSession">End session</button><p class="muted" id="sessionState">Report problem: vehicle does not fit / space occupied / arrival delay.</p>`,
        'PROV-LOCATION-01': () => `${ref('PROV-LOCATION-01')}<h2>Where is your parking?</h2><input id="hostLocation" placeholder="Address or location reference" value="${state.provider.location || ''}" /><textarea id="hostComment" placeholder="Driver instructions, gate access, size limits">${state.provider.comment || ''}</textarea>`,
        'PROV-SPACE-01': () => `${ref('PROV-SPACE-01')}<h2>What type of space is it?</h2><select id="hostType"><option>Covered private garage</option><option>Open private space</option><option>Building garage</option></select><div class="option">Photo upload placeholder</div>`,
        'PROV-AVAIL-01': () => `${ref('PROV-AVAIL-01')}<h2>When is it available?</h2><input id="hostSchedule" value="${state.provider.schedule || 'Mon-Fri 08:00-20:00'}" /><select id="hostStatus"><option>Pending review</option><option>Published</option><option>Paused</option></select>`,
        'PROV-TARIFF-01': () => `${ref('PROV-TARIFF-01')}<h2>Choose a tariff</h2><select id="hostTariff"><option value="$1,800 fixed 2h">Fixed: $1,800 / 2h</option><option value="$2,500 fixed 4h">Fixed: $2,500 / 4h</option><option value="$7,000 full day">Full day: $7,000</option><option value="custom">Custom tariff</option></select><input id="hostCustomTariff" placeholder="Custom tariff, e.g. $900/hour" />`,
        'PROV-PAYMENT-01': () => `${ref('PROV-PAYMENT-01')}<h2>How do you want to collect?</h2><select id="hostPayment"><option>Mercado Pago</option><option>Cash at arrival</option><option>Bank transfer</option><option>Mercado Pago + cash</option></select><p class="muted">This is mock-only. No real credentials or payment setup.</p>`,
        'PROV-REVIEW-01': () => `${ref('PROV-REVIEW-01')}<h2>Review publication</h2><div class="option"><strong>${state.provider.location || 'Provider space'}</strong><p class="muted">${state.provider.schedule || 'Schedule pending'}<br>${state.provider.tariff || '$1,800 fixed 2h'} · ${state.provider.payment || 'Mercado Pago'}</p><p class="muted">Estimated weekly earning: $${Math.round(price({price:state.provider.tariff})*4.5).toLocaleString('en-US')}</p></div><button id="saveProvider">Save and add to results</button>`,
        'OPS-HOME-01': () => `${ref('OPS-HOME-01')}<h2>Operations dashboard</h2><div class="stepbox">Pending provider spaces: <strong>${spaces().filter(s => s.status === 'Pending review').length}</strong></div><div class="stepbox">Active reservations: <strong>${state.selected ? 1 : 0}</strong></div>`,
        'OPS-PENDING-01': () => `${ref('OPS-PENDING-01')}<h2>Review provider spaces</h2>${spaces().map(s => `<div class="option"><strong>${s.title}</strong><p class="muted">${s.location}<br>${s.status}</p><button>Approve mock listing</button></div>`).join('') || '<p class="muted">No submitted provider spaces yet.</p>'}`,
        'OPS-INCIDENTS-01': () => `${ref('OPS-INCIDENTS-01')}<h2>Incidents</h2><div class="stepbox">Vehicle does not fit</div><div class="stepbox">Space occupied</div><div class="stepbox">Driver arrival delay</div>`,
        'OPS-SETTLEMENTS-01': () => `${ref('OPS-SETTLEMENTS-01')}<h2>Manual settlements</h2><p class="muted">Settlement remains a manual operations queue until the real backend/payment workflow is implemented.</p><div class="stepbox">Provider accounts ready: <strong>${spaces().filter(s => s.status === 'Published').length}</strong></div>`
      };
      function bindScreen(code){ if(code==='DRV-TIME-01'){ $('duration').value=state.duration; $('vehicle').value=state.vehicle; $('filter').value=state.filter; } document.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => { state.selected = options().find(o => o.id === el.dataset.pick); state.step++; render(); }); if($('rejectPay')) $('rejectPay').onclick = () => $('checkoutState').textContent = 'Payment rejected. Choose another method.'; if($('expireHold')) $('expireHold').onclick = () => $('checkoutState').textContent = 'Hold expired. Restart reservation.'; if($('extend')) $('extend').onclick = () => $('remaining').textContent = '2h 28m'; if($('endSession')) $('endSession').onclick = () => $('sessionState').textContent = 'Session ended. Settlement remains manual.'; if($('saveProvider')) $('saveProvider').onclick = saveProvider; }
      function capture(){ if($('destination')) state.destination = $('destination').value; if($('time')) state.time = $('time').value; if($('duration')) state.duration = $('duration').value; if($('vehicle')) state.vehicle = $('vehicle').value; if($('filter')) state.filter = $('filter').value; if($('hostLocation')) state.provider.location = $('hostLocation').value; if($('hostComment')) state.provider.comment = $('hostComment').value; if($('hostType')) state.provider.type = $('hostType').value; if($('hostSchedule')) state.provider.schedule = $('hostSchedule').value; if($('hostStatus')) state.provider.status = $('hostStatus').value; if($('hostTariff')) state.provider.tariff = $('hostTariff').value === 'custom' ? $('hostCustomTariff').value : $('hostTariff').value; if($('hostPayment')) state.provider.payment = $('hostPayment').value; }
      function saveProvider(){ capture(); const p = state.provider, tariff = p.tariff || '$1,800 fixed 2h'; const item = { id:`provider-${Date.now()}`, kind:'Private space', title:`Provider space near ${p.location || 'selected area'}`, location:p.location || 'Location pending', comment:p.comment || 'No extra instructions yet.', schedule:p.schedule || 'Schedule pending', price:tariff, payment:p.payment || 'Mercado Pago', meters:80+(price({price:tariff})%260), covered:String(p.type).includes('Covered') || String(p.type).includes('Building'), rating:4.6, status:p.status || 'Pending review', reservable:true }; save([item,...spaces()]); state.flow='driver'; state.step=2; render(); }
      $('next').onclick = () => { capture(); if(state.flow==='driver' && state.step===2 && !state.selected) return; if(state.flow==='provider' && state.step===5) return saveProvider(); state.step++; if(state.step >= flows[state.flow].length) return home(); render(); };
      $('back').onclick = () => { if(!state.step) return home(); state.step--; render(); }; $('homeBtn').onclick = home; function home(){ $('wizard').classList.add('hidden'); $('home').classList.remove('hidden'); $('subtitle').textContent='Choose a use case and follow the flow step by step.'; }
      document.querySelectorAll('[data-flow]').forEach(b => b.onclick = () => start(b.dataset.flow)); $('toggleRefs').onclick = () => { document.body.classList.toggle('refs-off'); $('toggleRefs').textContent = document.body.classList.contains('refs-off') ? 'Show labels' : 'Hide labels'; };
      $('demo').onclick = () => { start('driver'); state.destination='Movistar Arena'; state.time='Today 20:00'; state.filter='smart'; state.selected=seed[0]; state.step=5; render(); };
    </script>
  </body>
</html>
